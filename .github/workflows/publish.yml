# Public eagle-harness: upload a release to PyPI. Publishing a GitHub release vX.Y.Z on this repo builds the files with
# wheels.yml and uploads them with PyPI trusted publishing (no API token) once a maintainer approves the `pypi`
# environment, then attaches them to the release. In the private source repo this workflow is skipped: releases there
# come from release-please, and the upload happens on this repo after the export.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    if: github.repository == 'eagle-hq/EAGLE-4'
    uses: ./.github/workflows/wheels.yml
    with:
      ref: ${{ github.event.release.tag_name }}

  publish:
    needs: wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/eagle-harness/
    permissions:
      contents: write  # attach the files to the release
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: The upload set (sdist, binary wheel, pure wheel) carries the tag's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir upload
          cp dist/*.tar.gz dist/*.whl dist/pure/*.whl upload/
          ls -l upload
          test -f "upload/eagle_harness-${TAG#v}.tar.gz"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: upload
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" upload/* --repo "$GITHUB_REPOSITORY"
